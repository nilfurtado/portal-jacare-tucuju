<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8e8e8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Ícone de câmera -->
  <circle cx="400" cy="240" r="60" fill="none" stroke="#ccc" stroke-width="3"/>
  <circle cx="400" cy="240" r="35" fill="none" stroke="#ccc" stroke-width="3"/>
  <rect x="280" y="200" width="240" height="160" rx="20" fill="none" stroke="#ccc" stroke-width="3"/>
  <circle cx="480" cy="200" r="15" fill="#ccc"/>

  <!-- Texto -->
  <text x="400" y="380" font-size="36" fill="#999" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Sem imagem</text>
  <text x="400" y="430" font-size="18" fill="#bbb" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">Foto não disponível</text>
</svg>
