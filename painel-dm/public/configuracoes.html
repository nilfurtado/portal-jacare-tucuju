<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações · Painel DM</title>
  <meta name="robots" content="noindex, nofollow">
    <script>!function(){var t=localStorage.getItem("painel-dm:theme")||"dark";document.documentElement.dataset.theme=t}()</script>
  <script src="/painel/js/include.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,200..900,0..100,0..1;1,9..144,200..900,0..100,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/painel/css/tokens.css">
  <link rel="stylesheet" href="/painel/css/motion.css">
  <link rel="stylesheet" href="/painel/css/painel.css">
  <link rel="stylesheet" href="/painel/css/forms.css">
  <link rel="stylesheet" href="/painel/css/dark-mode.css">
  <link rel="stylesheet" href="/painel/css/tabela.css">
</head>
<body>
  <div class="painel">
    <div data-include="partials/shell.html"></div>

    <div class="main">
      <header class="topbar">
        <button class="topbar__btn" data-sidebar-toggle>Menu</button>
        <nav class="topbar__crumbs">
          <a href="/index.html">Painel</a>
          <span class="sep">/</span>
          <span>Configurações</span>
        </nav>
              <div class="topbar__actions">
          <button class="topbar__btn" id="theme-toggle" title="Alternar tema">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

      <main class="content">

        <header class="page-title">
          
          <div class="page-title__main">
            <p class="page-title__sub">Identidade & contato</p>
            <h1>O <em style="font-style:italic;color:var(--brand)">expediente</em>.</h1>
          </div>
                <div class="topbar__actions">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

        <form id="form-config">

          <section class="section">
            <div class="section__num">01</div>
            <div class="section__head">
              <h2>Identidade do portal</h2>
              <p>Como o portal se apresenta ao leitor.</p>
              <div class="section__body">
                <div class="form-grid">
                  <div class="field">
                    <label class="field__label req">Nome</label>
                    <input class="input" type="text" name="portal.nome" required>
                  </div>
                  <div class="field">
                    <label class="field__label">URL canônica</label>
                    <input class="input input--mono" type="text" name="portal.url" placeholder="https://…">
                  </div>
                </div>
                <div class="field form-row-full">
                  <label class="field__label">Slogan / linha-fina</label>
                  <input class="input" type="text" name="portal.slogan" placeholder="Notícias do Amapá e Região">
                </div>
              </div>
            </div>
          </section>

          <section class="section">
            <div class="section__num">02</div>
            <div class="section__head">
              <h2>Redes sociais</h2>
              <p>Links que aparecem no rodapé e no widget da sidebar. Deixe em branco para esconder.</p>
              <div class="section__body">
                <div class="form-grid">
                  <div class="field">
                    <label class="field__label">Facebook</label>
                    <input class="input input--mono" type="text" name="redes.facebook" placeholder="https://facebook.com/...">
                  </div>
                  <div class="field">
                    <label class="field__label">Instagram</label>
                    <input class="input input--mono" type="text" name="redes.instagram" placeholder="https://instagram.com/...">
                  </div>
                  <div class="field">
                    <label class="field__label">YouTube</label>
                    <input class="input input--mono" type="text" name="redes.youtube" placeholder="https://youtube.com/@...">
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="section">
            <div class="section__num">03</div>
            <div class="section__head">
              <h2>WhatsApp</h2>
              <p>Canal direto com a redação e grupo de notícias.</p>
              <div class="section__body">
                <div class="form-grid">
                  <div class="field">
                    <label class="field__label">Número (DDI + DDD + número)</label>
                    <input class="input input--mono" type="text" name="whatsapp.numero" data-phone placeholder="5596999999999" autocomplete="tel">
                  </div>
                  <div class="field">
                    <label class="field__label">Link do grupo</label>
                    <input class="input input--mono" type="text" name="whatsapp.grupo" placeholder="https://chat.whatsapp.com/...">
                  </div>
                </div>
              </div>
            </div>
          </section>

          <div class="form-actions">
            <button class="btn btn--ghost" type="reset">Reverter</button>
            <button class="btn btn--primary" type="submit" id="btn-salvar">Salvar configurações</button>
          </div>
        </form>

      </main>
    </div>
  </div>

  <script type="module">
    import { mountShell } from '/painel/js/shell.js';
    import { apiGet, apiPut } from '/painel/js/api.js';
    import { toast } from '/painel/js/ui.js';
    await mountShell({ route: 'configuracoes' });

    const form = document.getElementById('form-config');

    // Preenche campos dotted (ex: portal.nome) a partir do objeto
    function setNested(obj, key, val) {
      const parts = key.split('.');
      let cur = obj;
      for (let i = 0; i < parts.length - 1; i++) {
        cur[parts[i]] = cur[parts[i]] || {};
        cur = cur[parts[i]];
      }
      cur[parts[parts.length - 1]] = val;
    }
    function getNested(obj, key) {
      return key.split('.').reduce((o, p) => o?.[p], obj);
    }

    let cfg = await apiGet('/config').catch(() => ({}));
    [...form.elements].forEach(el => {
      if (el.name) el.value = getNested(cfg, el.name) || '';
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-salvar');
      const orig = btn.textContent;
      btn.disabled = true; btn.textContent = 'Salvando…';

      const body = {};
      [...form.elements].forEach(el => {
        if (el.name) setNested(body, el.name, el.value.trim());
      });

      try {
        cfg = await apiPut('/config', body);
        toast('Configurações salvas', 'success');
      } catch (err) {
        toast(err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = orig;
      }
    });
  </script>
</body>
</html>
