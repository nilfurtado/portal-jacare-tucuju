<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste Fetch</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
    pre { background: #222; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🧪 Teste de Fetch</h1>
  <button onclick="testFetch()">Clique para Testar</button>
  <pre id="output"></pre>

  <script>
    async function testFetch() {
      const output = document.getElementById('output');
      output.textContent = '⏳ Testando...\n';

      try {
        const url = '/api/rss-feeds/validate';
        output.textContent += `URL: ${url}\n`;
        output.textContent += `URL absoluta: ${new URL(url, window.location.href).href}\n`;
        output.textContent += `\n⏳ Enviando POST...\n`;

        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ url: 'test' })
        });

        output.textContent += `✅ Status: ${response.status}\n`;
        output.textContent += `✅ URL final: ${response.url}\n`;

        const data = await response.json();
        output.textContent += `✅ Resposta: ${JSON.stringify(data, null, 2)}\n`;
      } catch (err) {
        output.textContent += `❌ Erro: ${err.message}\n`;
        output.textContent += `❌ Stack: ${err.stack}\n`;
      }
    }
  </script>
</body>
</html>
