<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorias de Colunas · Painel DM</title>
  <meta name="robots" content="noindex, nofollow">

  <script>!function(){var t=localStorage.getItem("painel-dm:theme")||"dark";document.documentElement.dataset.theme=t}()</script>
  <script src="/painel/js/include.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,200..900,0..100,0..1;1,9..144,200..900,0..100,0..1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/painel/css/tokens.css">
  <link rel="stylesheet" href="/painel/css/motion.css">
  <link rel="stylesheet" href="/painel/css/painel.css">
  <link rel="stylesheet" href="/painel/css/forms.css">
  <link rel="stylesheet" href="/painel/css/dark-mode.css">
  <link rel="stylesheet" href="/painel/css/tabela.css">

  <style>
    .categories-grid {
      display: flex !important;
      flex-direction: column !important;
      gap: var(--s-2);
      margin-top: var(--s-6);
    }

    .category-card {
      background: var(--surface);
      border: 1px solid var(--paper-line);
      border-radius: var(--r-2);
      padding: var(--s-4);
      display: grid;
      grid-template-columns: 60px 1fr auto;
      gap: var(--s-3);
      align-items: center;
      transition: all var(--d-1) var(--ease-out);
    }

    .category-card:hover {
      border-color: var(--brand);
      box-shadow: var(--sh-1);
    }

    .category-color-box {
      width: 60px;
      height: 60px;
      border-radius: var(--r-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      font-size: 0.8rem;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .category-info {
      display: flex;
      flex-direction: column;
      gap: var(--s-1);
    }

    .category-name {
      font-weight: 600;
      color: var(--ink);
      font-size: 1rem;
    }

    .category-slug {
      font-size: 0.85rem;
      color: var(--ink-mute);
      font-family: var(--font-mono);
    }

    .category-actions {
      display: flex;
      gap: var(--s-2);
    }

    .btn-action {
      padding: var(--s-1) var(--s-2);
      border: 1px solid var(--paper-line);
      border-radius: var(--r-2);
      background: transparent;
      color: var(--ink-mute);
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: all var(--d-1) var(--ease-out);
    }

    .btn-action:hover {
      border-color: var(--brand);
      color: var(--brand);
      background: var(--brand-tint);
    }

    .btn-action.danger:hover {
      border-color: var(--danger);
      color: var(--danger);
      background: rgba(220, 53, 69, 0.1);
    }

    .empty-state {
      text-align: center;
      padding: var(--s-8) var(--s-5);
      color: var(--ink-mute);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--overlay);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--surface);
      border-radius: var(--r-3);
      padding: var(--s-6);
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--sh-pop);
      animation: slideIn var(--d-2) var(--ease-out);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: var(--s-2);
      margin-bottom: var(--s-4);
    }

    .form-field label {
      font-size: var(--t-small);
      font-weight: 500;
      color: var(--ink-soft);
    }

    .form-field input,
    .form-field textarea {
      padding: var(--s-2) var(--s-3);
      border: 1px solid var(--paper-line);
      border-radius: var(--r-2);
      background: var(--paper-warm);
      color: var(--ink);
      font-family: inherit;
      font-size: var(--t-body);
    }

    .form-field input:focus,
    .form-field textarea:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: var(--ring);
    }

    .form-field textarea {
      resize: vertical;
      min-height: 80px;
    }

    .modal-actions {
      display: flex;
      gap: var(--s-3);
      justify-content: flex-end;
      margin-top: var(--s-4);
      padding-top: var(--s-4);
      border-top: 1px solid var(--paper-line);
    }

    .toast {
      position: fixed;
      bottom: var(--s-5);
      right: var(--s-5);
      padding: var(--s-3) var(--s-4);
      background: var(--surface);
      border: 1px solid var(--paper-line);
      border-left: 4px solid var(--brand);
      border-radius: var(--r-2);
      z-index: 2000;
      animation: slideInRight var(--d-1) var(--ease-out);
      max-width: 400px;
      box-shadow: var(--sh-2);
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(100px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .toast.success {
      border-left-color: var(--positive);
    }

    .toast.error {
      border-left-color: var(--danger);
    }
  </style>
</head>
<body>
  <div class="painel">
    <div data-include="partials/shell.html"></div>

    <div class="main">
      <header class="topbar">
        <button class="topbar__btn" data-sidebar-toggle>Menu</button>
        <nav class="topbar__crumbs">
          <a href="/painel/">Painel</a><span class="sep">/</span><span>Colunas</span><span class="sep">/</span><span>Categorias</span>
        </nav>
      </header>

      <main class="content">
        <header class="page-title">
          <div class="page-title__main">
            <p class="page-title__sub">Redação · Colunas</p>
            <h1>Categorias de <em style="font-style:italic;color:var(--brand)">colunas</em>.</h1>
          </div>
        </header>

        <!-- KPI CARDS -->
        <section class="bento stagger">
          <article class="card card--narrow card--dark">
            <p class="card__eyebrow">— Total de categorias</p>
            <h2 class="card__metric" id="totalMetric">0</h2>
            <p class="card__label">cadastradas</p>
          </article>
          <article class="card card--narrow">
            <p class="card__eyebrow">— Mais usada</p>
            <h2 class="card__metric" id="maisUsadaMetric" style="word-break: break-word; font-size: 1.2rem;">—</h2>
            <p class="card__label">com colunas</p>
          </article>
        </section>

        <!-- PAGE TOOLBAR -->
        <div class="page-toolbar">
          <div style="display:flex;align-items:center;gap:var(--s-2);font-family:var(--font-mono);font-size:0.8rem;color:var(--ink-mute);text-transform:uppercase;letter-spacing:0.08em">Filtros:</div>
          <div class="page-toolbar__tabs">
            <input type="text" id="searchInput" class="tab-btn" placeholder="Buscar por nome..." style="flex: 1; min-width: 200px;">
          </div>
          <div class="page-toolbar__spacer"></div>
          <div class="page-toolbar__actions">
            <button class="btn btn--ghost" onclick="abrirFormularioNovo()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Nova categoria
            </button>
          </div>
        </div>

        <!-- Grid de Categorias -->
        <div class="categories-grid" id="categoriesGrid"></div>
      </main>
    </div>
  </div>

  <!-- Modal para criar/editar categoria -->
  <div id="modalForm" class="modal-overlay">
    <div class="modal-content">
      <h2 style="margin: 0 0 var(--s-4) 0;">Categoria de Coluna</h2>

      <form id="categoryForm">
        <div class="form-field">
          <label for="categoryName">Nome *</label>
          <input type="text" id="categoryName" required>
        </div>

        <div class="form-field">
          <label for="categorySlug">Slug *</label>
          <input type="text" id="categorySlug" required>
        </div>

        <div class="form-field">
          <label for="categoryColor">Cor *</label>
          <div style="display: grid; grid-template-columns: 80px 1fr 80px; gap: 12px; align-items: center;">
            <!-- Color Picker -->
            <input type="color" id="categoryColor" value="#ff9300" required style="width: 80px; height: 50px; border: 1px solid var(--paper-line); border-radius: var(--r-2); cursor: pointer;">

            <!-- Input Manual -->
            <input type="text" id="colorInput" value="#ff9300" placeholder="#ff9300 ou ff9300" style="
              padding: var(--s-2) var(--s-3);
              border: 1px solid var(--paper-line);
              border-radius: var(--r-2);
              background: var(--paper-warm);
              color: var(--ink);
              font-family: var(--font-mono);
              font-size: 0.9rem;
            ">

            <!-- Preview -->
            <div id="colorPreview" style="
              width: 80px;
              height: 50px;
              background-color: #ff9300;
              border-radius: var(--r-2);
              border: 1px solid var(--paper-line);
              display: flex;
              align-items: center;
              justify-content: center;
              font-weight: 600;
              color: white;
              text-shadow: 0 1px 2px rgba(0,0,0,0.3);
              font-size: 0.75rem;
            ">#FF9300</div>
          </div>
        </div>

        <div class="form-field">
          <label for="categoryDesc">Descrição</label>
          <textarea id="categoryDesc"></textarea>
        </div>

        <div class="form-field">
          <label for="categoryFoto">Foto destaque</label>
          <div style="display: flex; gap: 16px; align-items: flex-start;">
            <div style="
              width: 100px;
              height: 100px;
              background: var(--paper-warm);
              border-radius: var(--r-2);
              display: flex;
              align-items: center;
              justify-content: center;
              overflow: hidden;
            ">
              <img id="fotoPreview" src="" alt="Foto" style="width: 100%; height: 100%; object-fit: cover; display: none;">
              <span id="fotoPlaceholder" style="font-size: 2rem;">📷</span>
            </div>

            <div style="flex: 1;">
              <input type="file" id="categoryFoto" accept="image/jpeg,image/webp,image/png" style="
                padding: var(--s-2) var(--s-3);
                border: 1px solid var(--paper-line);
                border-radius: var(--r-2);
                background: var(--paper-warm);
                color: var(--ink);
                width: 100%;
                cursor: pointer;
              ">
              <p style="font-size: 0.8rem; color: var(--ink-mute); margin: var(--s-2) 0 0 0;">
                <strong>Formatos:</strong> .jpg, .webp, .png<br>
                <strong>Tamanho máximo:</strong> 8M
              </p>
            </div>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn--ghost" onclick="fecharModal()">Cancelar</button>
          <button type="submit" class="btn btn--primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast" style="display: none;"></div>

  <script src="/painel/js/include.js"></script>
  <script>
    // ===== Global Data Management =====
    let allCategorias = [];
    let editandoId = null;

    // Funções globais para botões
    function abrirFormularioNovo() {
      editandoId = null;
      document.getElementById('categoryForm').reset();
      document.getElementById('modalForm').classList.add('active');
      document.getElementById('categoryName').focus();
    }

    function editarCategoria(id) {
      const cat = allCategorias.find(c => c.id === id);
      if (!cat) return;

      editandoId = id;
      document.getElementById('categoryName').value = cat.nome;
      document.getElementById('categorySlug').value = cat.slug;
      document.getElementById('categoryColor').value = cat.cor;
      document.getElementById('categoryDesc').value = cat.descricao || '';

      // Carregar foto se existir
      const preview = document.getElementById('fotoPreview');
      const placeholder = document.getElementById('fotoPlaceholder');
      const fotoInput = document.getElementById('categoryFoto');

      if (cat.foto) {
        preview.src = cat.foto;
        preview.style.display = 'block';
        placeholder.style.display = 'none';
        fotoInput.dataset.base64 = cat.foto;
      } else {
        preview.style.display = 'none';
        placeholder.style.display = 'block';
        delete fotoInput.dataset.base64;
      }

      document.getElementById('modalForm').classList.add('active');
    }

    function fecharModal() {
      document.getElementById('modalForm').classList.remove('active');
      editandoId = null;

      // Limpar preview de foto
      const preview = document.getElementById('fotoPreview');
      const placeholder = document.getElementById('fotoPlaceholder');
      preview.style.display = 'none';
      placeholder.style.display = 'block';
      document.getElementById('categoryFoto').value = '';
      delete document.getElementById('categoryFoto').dataset.base64;
    }

    async function deletarCategoria(id) {
      if (!confirm('Tem certeza que deseja deletar esta categoria?')) return;

      allCategorias = allCategorias.filter(c => c.id !== id);
      await salvarCategorias();
      renderCategorias();
      updateMetrics();
      showToast('Categoria deletada', 'success');
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type}`;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3000);
    }
  </script>
  <script type="module">
    import { mountShell } from '/painel/js/shell.js';
    import { requireAuth } from '/painel/js/auth.js';

    const user = requireAuth();
    window.currentUser = user;  // Guardar user globalmente

    await mountShell({ route: 'categorias-colunas' });

    async function loadCategorias() {
      try {
        // Tentar carregar do localStorage primeiro (cache de edições)
        const cached = localStorage.getItem('categorias-colunas-temp');
        if (cached) {
          allCategorias = JSON.parse(cached);
          console.log('✅ Categorias carregadas do cache');
          renderCategorias();
          updateMetrics();
          return;
        }

        // Carregar do arquivo JSON
        const res = await fetch('/data/categorias-colunas.json');
        if (!res.ok) {
          allCategorias = [];
          return;
        }
        allCategorias = await res.json();
        renderCategorias();
        updateMetrics();
      } catch (err) {
        console.log('Erro ao carregar categorias:', err.message);
        allCategorias = [];
      }
    }

    function updateMetrics() {
      document.getElementById('totalMetric').textContent = allCategorias.length;

      if (allCategorias.length > 0) {
        const maisUsada = allCategorias.reduce((a, b) => a.count > b.count ? a : b);
        document.getElementById('maisUsadaMetric').textContent = maisUsada.nome;
      }
    }

    function renderCategorias() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const user = window.currentUser || {};
      const isColunista = user.tipo === 'colunista' || user.tipo === 'autor';

      const filtered = allCategorias.filter(cat => {
        const matchSearch = cat.nome.toLowerCase().includes(search) ||
          cat.slug.toLowerCase().includes(search);

        // Se colunista, mostrar apenas suas categorias
        // Se admin, mostrar todas
        const matchOwner = isColunista
          ? (cat.criadoPor === user.nome || !cat.criadoPor)
          : true;

        return matchSearch && matchOwner;
      });

      const grid = document.getElementById('categoriesGrid');

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state">Nenhuma categoria encontrada</div>';
        return;
      }

      grid.innerHTML = filtered.map(cat => `
        <div class="category-card">
          <div class="category-color-box" style="background-color: ${cat.cor}; position: relative; overflow: hidden;">
            ${cat.foto ? `
              <img src="${cat.foto}" alt="${cat.nome}" style="
                width: 100%;
                height: 100%;
                object-fit: cover;
                position: absolute;
                top: 0;
                left: 0;
              ">
            ` : `
              ${cat.count || 0}
            `}
          </div>
          <div class="category-info">
            <div class="category-name">${cat.nome}</div>
            <div class="category-slug">${cat.slug}</div>
            ${cat.descricao ? `<p style="font-size: 0.9rem; color: var(--ink-mute); margin: 0;">${cat.descricao}</p>` : ''}
          </div>
          <div class="category-actions">
            <button class="btn-action" onclick="editarCategoria('${cat.id}')">Editar</button>
            <button class="btn-action danger" onclick="deletarCategoria('${cat.id}')">Deletar</button>
          </div>
        </div>
      `).join('');
    }

    async function salvarCategorias() {
      // Salvar em localStorage como backup
      try {
        localStorage.setItem('categorias-colunas-temp', JSON.stringify(allCategorias));
        console.log('✅ Categorias salvas em cache local');
      } catch (err) {
        console.warn('Erro ao salvar em cache:', err);
      }
    }

    // Form submission
    document.getElementById('categoryForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const nome = document.getElementById('categoryName').value.trim();
      const slug = document.getElementById('categorySlug').value.trim();
      const cor = document.getElementById('categoryColor').value;
      const descricao = document.getElementById('categoryDesc').value.trim();

      if (!nome || !slug) {
        showToast('Preencha todos os campos obrigatórios', 'error');
        return;
      }

      if (editandoId) {
        // Editar existente
        const cat = allCategorias.find(c => c.id === editandoId);
        if (cat) {
          cat.nome = nome;
          cat.slug = slug;
          cat.cor = cor;
          cat.descricao = descricao;

          // Atualizar foto se houver
          const fotoInput = document.getElementById('categoryFoto');
          if (fotoInput.dataset.base64) {
            cat.foto = fotoInput.dataset.base64;
          }
        }
        showToast('Categoria atualizada', 'success');
      } else {
        // Criar novo
        const user = window.currentUser || {};
        const id = 'cat-' + Date.now();
        const fotoInput = document.getElementById('categoryFoto');
        const foto = fotoInput.dataset.base64 || '';

        allCategorias.push({
          id,
          nome,
          slug,
          cor,
          descricao,
          count: 0,
          foto: foto,  // Foto em base64
          criadoPor: user.nome || 'Admin'  // Guardar quem criou
        });
        showToast('Categoria criada', 'success');
      }

      await salvarCategorias();
      fecharModal();
      renderCategorias();
      updateMetrics();
    });

    // Atualizar preview da cor em tempo real (color picker)
    document.getElementById('categoryColor').addEventListener('input', (e) => {
      const cor = e.target.value;
      const preview = document.getElementById('colorPreview');
      const input = document.getElementById('colorInput');
      preview.style.backgroundColor = cor;
      preview.textContent = cor.toUpperCase();
      input.value = cor;
    });

    // Visualizar foto ao selecionar
    document.getElementById('categoryFoto').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const preview = document.getElementById('fotoPreview');
          const placeholder = document.getElementById('fotoPlaceholder');
          preview.src = event.target.result;
          preview.style.display = 'block';
          placeholder.style.display = 'none';
          // Guardar em formulário
          document.getElementById('categoryFoto').dataset.base64 = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Input manual de cor (digitação)
    document.getElementById('colorInput').addEventListener('input', (e) => {
      let valor = e.target.value.trim().toUpperCase();

      // Remover # se existir
      valor = valor.replace('#', '');

      // Validar formato hexadecimal (3 ou 6 dígitos)
      if (/^[0-9A-F]{3}([0-9A-F]{3})?$/.test(valor)) {
        // Se tem 3 dígitos, expandir para 6
        if (valor.length === 3) {
          valor = valor.split('').map(c => c + c).join('');
        }

        const corCompleta = '#' + valor;

        // Atualizar color picker e preview
        document.getElementById('categoryColor').value = corCompleta;
        const preview = document.getElementById('colorPreview');
        preview.style.backgroundColor = corCompleta;
        preview.textContent = corCompleta;

        // Mostrar com # no input
        e.target.value = corCompleta;
        e.target.style.color = 'var(--ink)';
      } else if (valor.length > 0) {
        e.target.style.color = 'var(--danger)';
      }
    });

    // Auto-gerar slug a partir do nome
    document.getElementById('categoryName').addEventListener('input', (e) => {
      const nome = e.target.value;
      if (nome && !editandoId) {  // Só auto-gerar se for novo (não editando)
        const slug = nome
          .toLowerCase()
          .replace(/[áàãâä]/g, 'a')
          .replace(/[éèêë]/g, 'e')
          .replace(/[íìîï]/g, 'i')
          .replace(/[óòôõö]/g, 'o')
          .replace(/[úùûü]/g, 'u')
          .replace(/[ç]/g, 'c')
          .replace(/[ñ]/g, 'n')
          .replace(/\s+/g, '-')
          .replace(/[^a-z0-9-]/g, '')
          .replace(/-+/g, '-')
          .replace(/^-|-$/g, '');
        document.getElementById('categorySlug').value = slug;
      }
    });

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', renderCategorias);

    // Fechar modal ao clicar fora
    document.getElementById('modalForm').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modalForm')) {
        fecharModal();
      }
    });

    // Load on init
    loadCategorias();
  </script>
</body>
</html>
