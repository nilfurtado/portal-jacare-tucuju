<header style="background: #1b5e20; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;">
  <div>
    <h2 style="margin: 0; font-size: 20px;">🐊 Painel DM</h2>
  </div>
  <nav style="display: flex; gap: 20px; align-items: center;">
    <a href="/painel/usuarios/" style="color: white; text-decoration: none;">👥 Usuários</a>
    <span id="user-name" style="color: #ddd;"></span>
    <button onclick="Auth.logout()" style="background: #d32f2f; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">🚪 Sair</button>
  </nav>
        <div class="topbar__actions">
          <button class="topbar__btn" id="theme-toggle" title="Alternar tema">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>

<script src="/auth-client.js"></script>
<script>
  Auth.requireAuth();
  const user = Auth.getUser();
  if (user) {
    document.getElementById('user-name').textContent = user.nome;
  }
</script>
