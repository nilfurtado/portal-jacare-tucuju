<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categorias · Painel DM</title>
  <meta name="robots" content="noindex, nofollow">

  <script>!function(){var t=localStorage.getItem("painel-dm:theme")||"dark";document.documentElement.dataset.theme=t}()</script>
  <script src="/painel/js/include.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,200..900,0..100,0..1;1,9..144,200..900,0..100,0..1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/painel/css/tokens.css">
  <link rel="stylesheet" href="/painel/css/motion.css">
  <link rel="stylesheet" href="/painel/css/painel.css">
  <link rel="stylesheet" href="/painel/css/forms.css">
  <link rel="stylesheet" href="/painel/css/dark-mode.css">
  <link rel="stylesheet" href="/painel/css/tabela.css">

  <style>
    .categories-grid {
      display: flex !important;
      flex-direction: column !important;
      gap: var(--s-2);
      margin-top: var(--s-6);
    }

    .category-card {
      background: var(--surface);
      border: 1px solid var(--paper-line);
      border-radius: var(--r-2);
      padding: var(--s-3);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--s-3);
      align-items: center;
      transition: all var(--d-1) var(--ease-out);
    }

    .category-card:hover {
      border-color: var(--brand);
      box-shadow: var(--sh-1);
    }

    .category-info {
      display: flex;
      flex-direction: column;
      gap: var(--s-1);
    }

    .category-name {
      font-weight: 600;
      color: var(--ink);
    }

    .category-slug {
      font-size: 0.85rem;
      color: var(--ink-mute);
      font-family: var(--font-mono);
    }

    .category-color {
      width: 100%;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: var(--t-small);
      color: white;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      position: relative;
      gap: var(--s-2);
    }

    .category-color .badge {
      background: rgba(0, 0, 0, 0.2);
      padding: var(--s-1) var(--s-2);
      border-radius: var(--r-pill);
      font-size: 0.7rem;
      font-weight: 700;
    }

    .category-info {
      padding: var(--s-4);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .category-name {
      font-size: var(--t-h3);
      font-weight: 600;
      margin: 0 0 var(--s-1) 0;
      color: var(--ink);
      cursor: pointer;
      transition: color var(--d-1) var(--ease-out);
    }

    .category-name:hover {
      color: var(--brand);
    }

    .category-slug {
      font-size: var(--t-micro);
      color: var(--ink-mute);
      font-family: var(--font-mono);
      margin-bottom: var(--s-3);
      word-break: break-all;
    }

    .category-desc {
      font-size: var(--t-small);
      color: var(--ink-mute);
      margin-bottom: var(--s-2);
      line-height: var(--lh-snug);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .category-status {
      display: inline-block;
      padding: var(--s-1) var(--s-2);
      border-radius: var(--r-1);
      font-size: var(--t-micro);
      font-weight: 600;
      margin-bottom: var(--s-3);
      width: fit-content;
    }

    .category-status.ativo {
      background: rgba(40, 167, 69, 0.15);
      color: var(--positive);
    }

    .category-status.inativo {
      background: rgba(220, 53, 69, 0.15);
      color: var(--danger);
    }

    .category-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: var(--s-2);
      padding-top: var(--s-3);
      border-top: 1px solid var(--paper-line);
      margin-top: auto;
    }

    .checkbox-select {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--brand);
    }

    .btn-action {
      padding: var(--s-1) var(--s-2);
      border: 1px solid var(--paper-line);
      border-radius: var(--r-2);
      background: transparent;
      color: var(--ink-mute);
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: all var(--d-1) var(--ease-out);
    }

    .btn-action:hover {
      border-color: var(--brand);
      color: var(--brand);
      background: var(--brand-tint);
    }

    .btn-action.ativo {
      background: rgba(40, 167, 69, 0.12);
      border-color: var(--positive);
      color: var(--positive);
    }

    .btn-action.inativo {
      background: rgba(220, 53, 69, 0.12);
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-action:hover:is(.ativo, .inativo) {
      background: var(--paper-warm);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: var(--s-8) var(--s-5);
      color: var(--ink-mute);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--overlay);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--surface);
      border-radius: var(--r-3);
      padding: var(--s-6);
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--sh-pop);
      animation: slideIn var(--d-2) var(--ease-out);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--s-4);
      padding-bottom: var(--s-4);
      border-bottom: 1px solid var(--paper-line);
    }

    .modal-header h2 {
      font-size: var(--t-h2);
      margin: 0;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--ink-mute);
      transition: color var(--d-1) var(--ease-out);
      padding: 0;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
    }

    .modal-close:hover {
      color: var(--ink);
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: var(--s-2);
      margin-bottom: var(--s-4);
    }

    .form-field label {
      font-size: var(--t-small);
      font-weight: 500;
      color: var(--ink-soft);
    }

    .form-field input,
    .form-field textarea {
      padding: var(--s-2) var(--s-3);
      border: 1px solid var(--paper-line);
      border-radius: var(--r-2);
      background: var(--paper-warm);
      color: var(--ink);
      font-family: inherit;
      font-size: var(--t-body);
    }

    .form-field input:focus,
    .form-field textarea:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: var(--ring);
    }

    .form-field textarea {
      resize: vertical;
      min-height: 100px;
    }

    .modal-actions {
      display: flex;
      gap: var(--s-3);
      justify-content: flex-end;
      margin-top: var(--s-4);
      padding-top: var(--s-4);
      border-top: 1px solid var(--paper-line);
    }

    .bulk-actions {
      display: none;
      align-items: center;
      gap: var(--s-4);
      padding: var(--s-4);
      background: var(--brand-soft);
      border: 1px solid var(--brand-tint);
      border-radius: var(--r-3);
      margin-bottom: var(--s-4);
      margin-top: var(--s-6);
    }

    .bulk-actions.active {
      display: flex;
    }

    .bulk-counter {
      font-weight: 600;
      color: var(--brand);
      font-size: var(--t-small);
      flex: 1;
    }

    .toast {
      position: fixed;
      bottom: var(--s-5);
      right: var(--s-5);
      padding: var(--s-3) var(--s-4);
      background: var(--surface);
      border: 1px solid var(--paper-line);
      border-left: 4px solid var(--brand);
      border-radius: var(--r-2);
      z-index: 2000;
      animation: slideInRight var(--d-1) var(--ease-out);
      max-width: 400px;
      box-shadow: var(--sh-2);
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(100px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .toast.success {
      border-left-color: var(--positive);
    }

    .toast.error {
      border-left-color: var(--danger);
    }

    .page-toolbar {
      display: flex;
      align-items: center;
      gap: var(--s-4);
      padding: var(--s-4) var(--s-6);
      background: var(--surface);
      border: 1px solid var(--paper-line);
      border-radius: var(--r-3);
      margin: var(--s-6) 0 var(--s-4);
      flex-wrap: wrap;
    }

    .page-toolbar__tabs {
      display: flex;
      gap: var(--s-3);
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: var(--s-2) var(--s-3);
      border: 1px solid var(--paper-line);
      border-radius: var(--r-2);
      background: var(--paper-warm);
      color: var(--ink);
      font-size: var(--t-small);
      cursor: pointer;
      transition: all var(--d-1) var(--ease-out);
    }

    .tab-btn:hover,
    .tab-btn:focus {
      border-color: var(--brand);
      box-shadow: var(--ring);
    }

    .page-toolbar__spacer {
      flex: 1;
    }

    .page-toolbar__actions {
      display: flex;
      gap: var(--s-3);
    }

    @media (max-width: 768px) {
      .categories-grid {
        grid-template-columns: 1fr;
      }

      .category-actions {
        grid-template-columns: 1fr 1fr;
      }

      .modal-content {
        width: 95%;
      }

      .page-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .page-toolbar__spacer {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="painel">
    <div data-include="partials/shell.html"></div>

    <div class="main">
      <header class="topbar">
        <button class="topbar__btn" data-sidebar-toggle>Menu</button>
        <nav class="topbar__crumbs">
          <a href="/painel/">Painel</a><span class="sep">/</span><span>Notícias</span><span class="sep">/</span><span>Categorias</span>
        </nav>
      </header>

      <main class="content">
        <header class="page-title">
          <div class="page-title__main">
            <p class="page-title__sub">Redação · Categorias</p>
            <h1>Gerenciador de <em style="font-style:italic;color:var(--brand)">categorias</em>.</h1>
          </div>
        </header>

        <!-- KPI CARDS -->
        <section class="bento stagger">
          <article class="card card--narrow card--dark">
            <p class="card__eyebrow">— Total de categorias</p>
            <h2 class="card__metric" id="totalMetric">0</h2>
            <p class="card__label">cadastradas</p>
          </article>
          <article class="card card--narrow">
            <p class="card__eyebrow">— Em destaque</p>
            <h2 class="card__metric" id="destaquesMetric">0</h2>
            <p class="card__label">no menu principal</p>
          </article>
          <article class="card card--narrow">
            <p class="card__eyebrow">— Ocultas</p>
            <h2 class="card__metric" id="ocultasMetric">0</h2>
            <p class="card__label">não exibidas</p>
          </article>
          <article class="card card--narrow">
            <p class="card__eyebrow">— Mais usada</p>
            <h2 class="card__metric" id="maisUsadaMetric" style="word-break: break-word; font-size: 1.2rem;">—</h2>
            <p class="card__label">com notícias</p>
          </article>
        </section>

        <!-- PAGE TOOLBAR -->
        <div class="page-toolbar">
          <div style="display:flex;align-items:center;gap:var(--s-2);font-family:var(--font-mono);font-size:0.8rem;color:var(--ink-mute);text-transform:uppercase;letter-spacing:0.08em">Filtros:</div>
          <div class="page-toolbar__tabs">
            <input type="text" id="searchInput" class="tab-btn" placeholder="Buscar por nome ou slug..." style="flex: 1; min-width: 200px;">
            <select id="filterStatus" class="tab-btn">
              <option value="">Todas</option>
              <option value="destaque">Em Destaque</option>
              <option value="oculta">Ocultas</option>
            </select>
            <select id="sortBy" class="tab-btn">
              <option value="ordem" selected>Prioridade ↑</option>
              <option value="nome">Nome ↑</option>
              <option value="noticias">Notícias ↓</option>
            </select>
          </div>
          <div class="page-toolbar__spacer"></div>
          <div class="page-toolbar__actions">
            <button class="btn btn--ghost" data-action="novo" onclick="abrirFormularioNovo()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Nova categoria
            </button>
          </div>
        </div>

        <!-- Bulk actions -->
        <div class="bulk-actions" id="bulkActions">
          <span class="bulk-counter">0 selecionadas</span>
          <button class="btn btn--primary" onclick="bulkDestaque(true)">✓ Destacar</button>
          <button class="btn btn--primary" onclick="bulkDestaque(false)">✕ Ocultar</button>
          <button class="btn btn--ghost" onclick="bulkDelete()">Deletar</button>
        </div>

        <!-- Grid -->
        <div class="categories-grid" id="categoriesGrid">
          <div class="empty-state">Carregando...</div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalDetalhes">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Detalhes da Categoria</h2>
        <button class="modal-close" onclick="fecharModal()">×</button>
      </div>
      <form id="formModal">
        <div class="form-field">
          <label>Nome</label>
          <input type="text" id="modalNome" required>
        </div>
        <div class="form-field">
          <label>Slug (read-only)</label>
          <div style="display: flex; gap: var(--s-2);">
            <input type="text" id="modalSlug" readonly style="flex: 1;">
            <button type="button" class="btn btn--ghost" onclick="copiarSlug()">Copiar</button>
          </div>
        </div>
        <div class="form-field">
          <label>Cor</label>
          <div style="display: flex; gap: var(--s-2); align-items: center;">
            <input type="color" id="modalCor" style="width: 60px; height: 45px; border: 2px solid var(--paper-line); border-radius: var(--r-2); cursor: pointer;">
            <input type="text" id="modalCorCode" placeholder="#000000" style="flex: 1; font-family: var(--font-mono); font-size: 0.85rem;">
          </div>
        </div>
        <div class="form-field">
          <label>Descrição</label>
          <textarea id="modalDescricao" placeholder="Descrição completa da categoria..."></textarea>
        </div>
        <div class="form-field">
          <label>Prioridade</label>
          <input type="number" id="modalOrdem" min="1">
        </div>
        <div class="form-field">
          <label>Notícias</label>
          <input type="text" id="modalNoticias" readonly>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn--ghost" onclick="fecharModal()">Cancelar</button>
          <button type="submit" class="btn btn--primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Novo -->
  <div class="modal-overlay" id="modalNovo">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Nova Categoria</h2>
        <button class="modal-close" onclick="fecharModalNovo()">×</button>
      </div>
      <form id="formNovaCategoria">
        <div class="form-field">
          <label>Nome *</label>
          <input type="text" id="inputNome" placeholder="Ex: Tecnologia" required>
        </div>
        <div class="form-field">
          <label>Descrição *</label>
          <input type="text" id="inputDescricao" placeholder="Breve descrição..." required>
        </div>
        <div class="form-field">
          <label>Prioridade</label>
          <input type="number" id="inputOrdem" value="1" min="1">
        </div>
        <div class="form-field">
          <label>Cor</label>
          <div style="display: flex; gap: var(--s-2); align-items: center;">
            <input type="color" id="inputCor" value="#FF7B42" style="width: 60px; height: 45px; border: 2px solid var(--paper-line); border-radius: var(--r-2); cursor: pointer;">
            <input type="text" id="inputCorCode" placeholder="#FF7B42" value="#FF7B42" style="flex: 1; font-family: var(--font-mono); font-size: 0.85rem;">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn--ghost" onclick="fecharModalNovo()">Cancelar</button>
          <button type="submit" class="btn btn--primary">Criar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { mountShell } from '/painel/js/shell.js';
    import { apiGet, apiPost, apiPut, apiPatch, apiDelete } from '/painel/js/api.js';
    import { toast, confirmar } from '/painel/js/ui.js';

    let categorias = [];
    let modalSlugAtual = '';

    async function carregar() {
      try {
        categorias = await apiGet('/categorias');
        atualizarMetricas();
        renderizar();
      } catch (err) {
        mostrarToast('Erro ao carregar categorias', 'error');
        console.error(err);
      }
    }

    function atualizarMetricas() {
      document.getElementById('totalMetric').textContent = categorias.length;
      document.getElementById('destaquesMetric').textContent = categorias.filter(c => c.destaque !== false).length;
      document.getElementById('ocultasMetric').textContent = categorias.filter(c => c.destaque === false).length;

      const maisUsada = categorias.reduce((prev, current) =>
        (prev.noticiasCount || 0) > (current.noticiasCount || 0) ? prev : current
      );
      document.getElementById('maisUsadaMetric').textContent = maisUsada?.nome || '—';
    }

    function renderizar() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const filterStatus = document.getElementById('filterStatus').value;
      const sortBy = document.getElementById('sortBy').value;

      let filtradas = categorias.filter(c => {
        const matchSearch = !searchTerm || c.nome.toLowerCase().includes(searchTerm) || c.slug.toLowerCase().includes(searchTerm);
        const matchFilter = !filterStatus || (filterStatus === 'destaque' && c.destaque !== false) || (filterStatus === 'oculta' && c.destaque === false);
        return matchSearch && matchFilter;
      });

      if (sortBy === 'nome') filtradas.sort((a, b) => (a.nome || a.label || '').localeCompare(b.nome || b.label || ''));
      else if (sortBy === 'noticias') filtradas.sort((a, b) => (b.noticiasCount || 0) - (a.noticiasCount || 0));
      else filtradas.sort((a, b) => (a.ordem || 0) - (b.ordem || 0)); // padrão: ordem crescente

      const grid = document.getElementById('categoriesGrid');
      if (filtradas.length === 0) {
        grid.innerHTML = '<div class="empty-state">Nenhuma categoria encontrada</div>';
        return;
      }

      grid.innerHTML = filtradas.map((c, idx) => `
        <div class="category-card" data-slug="${c.slug}" style="grid-template-columns: 60px 1fr auto;">
          <div style="display: flex; align-items: center; justify-content: center; font-size: 2.8rem; font-weight: 900; color: ${c.cor}; opacity: 0.2;">
            #${c.ordem || idx + 1}
          </div>
          <div class="category-info" style="padding: 0;">
            <div style="display: flex; align-items: center; gap: var(--s-2);">
              <div style="width: 20px; height: 20px; background: ${c.cor}; border-radius: var(--r-1);"></div>
              <span class="category-name">${c.nome}</span>
              <span style="font-size: 0.75rem; background: var(--paper-warm); color: var(--ink-mute); padding: 2px 6px; border-radius: var(--r-1); font-family: var(--font-mono);">${c.cor}</span>
              <span style="font-size: 0.8rem; color: var(--ink-mute);">${c.noticiasCount || 0} notícias</span>
            </div>
            <div class="category-slug">${c.slug}</div>
          </div>
          <div style="display: flex; gap: var(--s-2);">
            ${idx > 0 ? `<button class="btn-action" onclick="moverPara('${c.slug}', 'cima')" title="Mover para cima">↑</button>` : `<button class="btn-action" disabled style="opacity: 0.3; cursor: not-allowed;">↑</button>`}
            ${idx < filtradas.length - 1 ? `<button class="btn-action" onclick="moverPara('${c.slug}', 'baixo')" title="Mover para baixo">↓</button>` : `<button class="btn-action" disabled style="opacity: 0.3; cursor: not-allowed;">↓</button>`}
            <button class="btn-action ${c.destaque !== false ? 'ativo' : 'inativo'}" onclick="toggleDestaque('${c.slug}')" title="Toggle">
              ${c.destaque !== false ? '⭐' : '☆'}
            </button>
            <button class="btn-action" onclick="abrirModal('${c.slug}')" title="Editar">✎</button>
            <button class="btn-action" onclick="deletarCategoria('${c.slug}')" title="Deletar">×</button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.checkbox-select').forEach(cb => {
        cb.addEventListener('change', atualizarBulkActions);
      });
    }

    window.moverPara = async (slug, direcao) => {
      try {
        const idx = categorias.findIndex(c => c.slug === slug);
        if (idx === -1) return;

        const novaOrdem = direcao === 'cima' ? (categorias[idx].ordem || idx + 1) - 1 : (categorias[idx].ordem || idx + 1) + 1;

        if (novaOrdem < 1) {
          mostrarToast('Já está no topo', 'error');
          return;
        }

        await apiPatch(`/categorias/${slug}/ordem`, { novaOrdem });
        mostrarToast(`✓ Categoria movida ${direcao === 'cima' ? '↑' : '↓'}`, 'success');
        carregar();
      } catch (err) {
        mostrarToast('Erro ao mover', 'error');
        console.error(err);
      }
    };

    window.toggleDestaque = async (slug) => {
      try {
        const cat = categorias.find(c => c.slug === slug);
        const novoDestaque = cat.destaque === false;
        await apiPut(`/categorias/${slug}`, { destaque: novoDestaque });
        mostrarToast(novoDestaque ? '⭐ Adicionado ao menu' : '✗ Removido do menu', 'success');
        carregar();
      } catch (err) {
        mostrarToast('Erro ao atualizar', 'error');
      }
    };

    window.abrirFormularioNovo = () => {
      document.getElementById('modalNovo').classList.add('active');
    };

    window.fecharModalNovo = () => {
      document.getElementById('modalNovo').classList.remove('active');
    };

    window.abrirModal = (slug) => {
      const cat = categorias.find(c => c.slug === slug);
      if (!cat) return;

      modalSlugAtual = slug;
      document.getElementById('modalNome').value = cat.nome;
      document.getElementById('modalSlug').value = cat.slug;
      document.getElementById('modalCor').value = cat.cor || '#999999';
      document.getElementById('modalCorCode').value = cat.cor || '#999999';
      document.getElementById('modalDescricao').value = cat.descricao || '';
      document.getElementById('modalOrdem').value = cat.ordem || 1;
      document.getElementById('modalNoticias').value = `${cat.noticiasCount || 0} notícias`;

      document.getElementById('modalDetalhes').classList.add('active');
    };

    window.fecharModal = () => {
      document.getElementById('modalDetalhes').classList.remove('active');
    };

    window.copiarSlug = () => {
      navigator.clipboard.writeText(document.getElementById('modalSlug').value);
      mostrarToast('✓ Slug copiado!', 'success');
    };

    // Sincronizar color picker e input de texto (modal edição)
    document.getElementById('modalCor').addEventListener('input', (e) => {
      document.getElementById('modalCorCode').value = e.target.value;
    });

    document.getElementById('modalCorCode').addEventListener('input', (e) => {
      const val = e.target.value.trim();
      if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
        document.getElementById('modalCor').value = val;
      }
    });

    // Sincronizar color picker e input de texto (modal nova)
    document.getElementById('inputCor').addEventListener('input', (e) => {
      document.getElementById('inputCorCode').value = e.target.value;
    });

    document.getElementById('inputCorCode').addEventListener('input', (e) => {
      const val = e.target.value.trim();
      if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
        document.getElementById('inputCor').value = val;
      }
    });

    window.deletarCategoria = async (slug) => {
      const ok = await confirmar({ titulo: 'Deletar categoria?', mensagem: `Slug: ${slug}`, okText: 'Deletar' });
      if (!ok) return;
      try {
        await apiDelete(`/categorias/${slug}`);
        mostrarToast('✓ Categoria deletada', 'success');
        carregar();
      } catch (err) {
        mostrarToast('Erro ao deletar', 'error');
      }
    };

    window.bulkDestaque = async (destaque) => {
      const slugs = Array.from(document.querySelectorAll('.checkbox-select:checked')).map(cb => cb.dataset.slug);
      if (slugs.length === 0) return;
      for (const slug of slugs) {
        try {
          await apiPut(`/categorias/${slug}`, { destaque });
        } catch (err) {
          console.error(err);
        }
      }
      mostrarToast(`✓ ${slugs.length} atualizada(s)`, 'success');
      carregar();
    };

    window.bulkDelete = async () => {
      const slugs = Array.from(document.querySelectorAll('.checkbox-select:checked')).map(cb => cb.dataset.slug);
      if (slugs.length === 0) return;
      const ok = await confirmar({ titulo: `Deletar ${slugs.length} categorias?`, mensagem: 'Não pode ser desfeito', okText: 'Deletar' });
      if (!ok) return;
      for (const slug of slugs) {
        try {
          await apiDelete(`/categorias/${slug}`);
        } catch (err) {
          console.error(err);
        }
      }
      mostrarToast(`✓ ${slugs.length} deletada(s)`, 'success');
      carregar();
    };

    function atualizarBulkActions() {
      const selecionadas = document.querySelectorAll('.checkbox-select:checked').length;
      const bulkDiv = document.getElementById('bulkActions');
      if (selecionadas > 0) {
        bulkDiv.classList.add('active');
        bulkDiv.querySelector('.bulk-counter').textContent = `${selecionadas} selecionada${selecionadas > 1 ? 's' : ''}`;
      } else {
        bulkDiv.classList.remove('active');
      }
    }

    function mostrarToast(msg, tipo = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${tipo}`;
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    document.getElementById('formNovaCategoria').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('inputNome').value.trim();
      const descricao = document.getElementById('inputDescricao').value.trim();
      const cor = (document.getElementById('inputCorCode').value.trim() || document.getElementById('inputCor').value).toUpperCase();
      const ordem = parseInt(document.getElementById('inputOrdem').value) || 1;

      console.log('[formNovaCategoria] Enviando:', { label: nome, cor, descricao, ordem });

      if (!nome) {
        mostrarToast('Nome é obrigatório', 'error');
        return;
      }

      if (!cor || !/^#[0-9A-F]{6}$/.test(cor)) {
        mostrarToast('Cor inválida. Use formato #RRGGBB', 'error');
        return;
      }

      try {
        await apiPost('/categorias', { label: nome, descricao, cor, ordem });
        mostrarToast('✓ Categoria criada', 'success');
        e.target.reset();
        document.getElementById('inputCor').value = '#FF7B42';
        document.getElementById('inputCorCode').value = '#FF7B42';
        fecharModalNovo();
        carregar();
      } catch (err) {
        console.error('[formNovaCategoria] Erro:', err);
        mostrarToast('Erro ao criar: ' + (err.data?.erro || err.message), 'error');
      }
    });

    document.getElementById('formModal').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('modalNome').value.trim();
      const cor = (document.getElementById('modalCorCode').value.trim() || document.getElementById('modalCor').value).toUpperCase();
      const descricao = document.getElementById('modalDescricao').value.trim();
      const ordem = parseInt(document.getElementById('modalOrdem').value);

      console.log('[formModal] Enviando:', { slug: modalSlugAtual, label: nome, cor, descricao, ordem });

      if (!nome) {
        mostrarToast('Nome é obrigatório', 'error');
        return;
      }

      if (!cor || !/^#[0-9A-F]{6}$/.test(cor)) {
        mostrarToast('Cor inválida. Use formato #RRGGBB', 'error');
        return;
      }

      try {
        const resp = await apiPut(`/categorias/${modalSlugAtual}`, { label: nome, cor, descricao, ordem });
        console.log('[formModal] Resposta:', resp);
        mostrarToast('✓ Categoria atualizada', 'success');
        fecharModal();
        carregar();
      } catch (err) {
        console.error('[formModal] Erro:', err);
        mostrarToast('Erro ao salvar: ' + (err.data?.erro || err.message), 'error');
      }
    });

    document.getElementById('searchInput').addEventListener('input', renderizar);
    document.getElementById('filterStatus').addEventListener('change', renderizar);
    document.getElementById('sortBy').addEventListener('change', renderizar);

    document.getElementById('modalDetalhes').addEventListener('click', (e) => {
      if (e.target.id === 'modalDetalhes') fecharModal();
    });

    document.getElementById('modalNovo').addEventListener('click', (e) => {
      if (e.target.id === 'modalNovo') fecharModalNovo();
    });

    (async () => {
      try {
        await mountShell({ route: 'categorias' });
        console.log('[categorias] Página carregada -', new Date().toISOString());
        carregar();
      } catch (err) {
        console.error('Erro ao inicializar:', err);
        mostrarToast('Erro ao carregar painel', 'error');
      }
    })();
  </script>
</body>
</html>
