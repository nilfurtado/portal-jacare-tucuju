<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Vídeo · Painel DM</title>
  <meta name="robots" content="noindex, nofollow">
  <script>!function(){var t=localStorage.getItem("painel-dm:theme")||"dark";document.documentElement.dataset.theme=t}()</script>
  <script src="/painel/js/include.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,200..900,0..100,0..1;1,9..144,200..900,0..100,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/painel/css/tokens.css">
  <link rel="stylesheet" href="/painel/css/motion.css">
  <link rel="stylesheet" href="/painel/css/painel.css">
  <link rel="stylesheet" href="/painel/css/forms.css">
  <link rel="stylesheet" href="/painel/css/dark-mode.css">
</head>
<body>
  <div class="painel">
    <div data-include="partials/shell.html"></div>
    <div class="main">
      <header class="topbar">
        <button class="topbar__btn" data-sidebar-toggle>Menu</button>
        <nav class="topbar__crumbs">
          <a href="/painel/">Painel</a><span class="sep">/</span>
          <a href="/painel/videos/">Vídeos</a><span class="sep">/</span>
          <span>Novo</span>
        </nav>
              <div class="topbar__actions">
          <button class="topbar__btn" id="theme-toggle" title="Alternar tema">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

      <main class="content">
        <header class="page-title">
          <div class="page-title__main">
            <p class="page-title__sub">Multimídia · novo vídeo</p>
            <h1>Cadastrar <em style="font-style:italic;color:var(--brand)">vídeo</em>.</h1>
          </div>
                <div class="topbar__actions">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

        <form id="form-novo-video" style="max-width:600px;">
          <div class="form-group">
            <label class="form-label">Título *</label>
            <input type="text" id="titulo" name="titulo" class="form-input" required>
          </div>

          <div class="form-group">
            <label class="form-label">URL do Vídeo (YouTube/Vimeo) *</label>
            <input type="url" id="url" name="url" class="form-input" required placeholder="https://youtube.com/embed/...">
          </div>

          <div class="form-group">
            <label class="form-label">Descrição</label>
            <textarea id="descricao" name="descricao" class="form-input" style="resize:vertical; min-height:120px;"></textarea>
          </div>

          <div style="display:flex; gap:var(--s-3); margin-top:var(--s-6);">
            <button type="submit" class="btn btn--primary">✓ Salvar</button>
            <button type="button" class="btn btn--ghost" onclick="window.location.href='/painel/videos/'">Cancelar</button>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script type="module">
    import { mountShell } from '/painel/js/shell.js';
    import { apiPost } from '/painel/js/api.js';

    await mountShell({ route: 'video-novo' });

    const form = document.getElementById('form-novo-video');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const dados = {
        titulo: document.getElementById('titulo').value,
        url: document.getElementById('url').value,
        descricao: document.getElementById('descricao').value,
      };

      try {
        await apiPost('/api/videos', dados);
        alert('✅ Vídeo cadastrado com sucesso!');
        window.location.href = '/painel/videos/';
      } catch (err) {
        alert('❌ Erro: ' + err.message);
      }
    });
  </script>
</body>
</html>
