<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comentários · Painel DM</title>
  <meta name="robots" content="noindex, nofollow">
    <script>!function(){var t=localStorage.getItem("painel-dm:theme")||"dark";document.documentElement.dataset.theme=t}()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
    <script>!function(){var t=localStorage.getItem("painel-dm:theme")||"dark";document.documentElement.dataset.theme=t}()</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,200..900,0..100,0..1;1,9..144,200..900,0..100,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/painel.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/tabela.css">
  <style>
    .comm-text { font-size: 0.87rem; line-height: 1.4; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .comm-noticia { font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-mute); }
    .comm-noticia a { color: var(--brand); text-decoration: none; }
  </style>
</head>
<body>
  <div class="painel">
    <div data-include="partials/shell.html"></div>
    <div class="main">
      <header class="topbar">
        <button class="topbar__btn" data-sidebar-toggle>Menu</button>
        <nav class="topbar__crumbs">
          <a href="/index.html">Painel</a><span class="sep">/</span><span>Comentários</span>
        </nav>
      </header>

      <main class="content">
        <header class="page-title">
          <div class="page-title__index">10</div>
          <div class="page-title__main">
            <p class="page-title__sub">Moderação</p>
            <h1>O que <em style="font-style:italic;color:var(--brand)">disseram</em>.</h1>
          </div>
        </header>

        <!-- PAGE TOOLBAR -->
        <div class="page-toolbar">
          <div class="page-toolbar__search">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input class="input" type="text" id="search-comm" placeholder="Buscar comentários…" autocomplete="off">
          </div>
          <div class="page-toolbar__tabs" id="tabs">
            <button class="tab-btn is-active" data-filter="">Todos <span class="tab-count" data-count-all>0</span></button>
            <button class="tab-btn" data-filter="pendente">Pendentes <span class="tab-count" data-count-pendente>0</span></button>
            <button class="tab-btn" data-filter="aprovado">Aprovados <span class="tab-count" data-count-aprovado>0</span></button>
            <button class="tab-btn" data-filter="rejeitado">Rejeitados <span class="tab-count" data-count-rejeitado>0</span></button>
          </div>
        </div>

        <!-- TABELA -->
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Autor</th>
                <th>Comentário</th>
                <th>Matéria</th>
                <th style="text-align:center">Status</th>
                <th>Data</th>
                <th style="width:80px"></th>
              </tr>
            </thead>
            <tbody id="lista-comm">
              <tr><td colspan="6" style="text-align:center;color:var(--ink-mute);padding:var(--s-6);font-family:var(--font-mono);font-size:0.78rem">Carregando…</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { mountShell } from './js/shell.js';
    import { apiGet, apiPatch, apiDelete } from './js/api.js';
    import { toast, confirmar } from './js/ui.js';
    await mountShell({ route: 'comentarios' });

    function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

    let allComments = [];
    let currentFilter = '';

    async function carregar(){
      allComments = await apiGet('/comentarios').catch(()=>[]);
      atualizarContadores();
      render();
    }

    function atualizarContadores(){
      const c = (s) => allComments.filter(x => !s || x.status === s).length;
      document.querySelector('[data-count-all]').textContent = c('');
      document.querySelector('[data-count-pendente]').textContent = c('pendente');
      document.querySelector('[data-count-aprovado]').textContent = c('aprovado');
      document.querySelector('[data-count-rejeitado]').textContent = c('rejeitado');
    }

    function statusTag(status) {
      const map = { 'pendente': 'tag--warn', 'aprovado': 'tag--ok', 'rejeitado': 'tag--danger' };
      return `<span class="tag ${map[status] || ''}" style="text-transform:capitalize">${status}</span>`;
    }

    function render(){
      const items = currentFilter ? allComments.filter(c => c.status === currentFilter) : allComments;
      const cont = document.getElementById('lista-comm');
      if(!items.length){
        cont.innerHTML = `<tr><td colspan="6" style="color:var(--ink-mute);text-align:center;padding:var(--s-7);font-family:var(--font-display);font-style:italic;font-size:1rem">Nada a moderar por aqui.</td></tr>`;
        return;
      }
      cont.innerHTML = items.map(c => `
        <tr data-id="${c.id}">
          <td class="num">${esc(c.autor)}</td>
          <td><div class="comm-text">${esc(c.texto)}</div></td>
          <td><a class="comm-noticia" href="../noticia.html?slug=${encodeURIComponent(c.noticiaSlug)}" target="_blank">${esc(c.noticiaSlug)}</a></td>
          <td style="text-align:center">${statusTag(c.status)}</td>
          <td class="num">${new Date(c.criadoEm).toLocaleDateString('pt-BR')}</td>
          <td style="text-align:right">
            <div class="row-actions">
              ${c.status !== 'aprovado' ? '<button data-action="aprovar" title="Aprovar"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></button>' : ''}
              ${c.status !== 'rejeitado' ? '<button data-action="rejeitar" title="Rejeitar"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' : ''}
              <button data-action="remover" class="danger" title="Remover"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('tabs').addEventListener('click', e => {
      const btn = e.target.closest('.tab-btn'); if(!btn) return;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('is-active', b === btn));
      currentFilter = btn.dataset.filter;
      render();
    });

    document.getElementById('lista-comm').addEventListener('click', async e => {
      const btn = e.target.closest('button[data-action]'); if(!btn) return;
      const id = btn.closest('tr').dataset.id;
      const ac = btn.dataset.action;
      try {
        if(ac === 'aprovar'){ await apiPatch(`/comentarios/${id}/aprovar`); toast('Aprovado','success'); }
        else if(ac === 'rejeitar'){ await apiPatch(`/comentarios/${id}/rejeitar`); toast('Rejeitado','success'); }
        else if(ac === 'remover'){
          const ok = await confirmar({ titulo:'Remover comentário?', mensagem:'Ação definitiva.', okText:'Remover' });
          if(!ok) return;
          await apiDelete(`/comentarios/${id}`); toast('Removido','success');
        }
        carregar();
      } catch(err){ toast(err.message,'error'); }
    });

    carregar();
  </script>
</body>
</html>
