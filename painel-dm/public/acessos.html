<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acessos · Painel DM</title>
  <meta name="robots" content="noindex, nofollow">
  <script>!function(){var t=localStorage.getItem("painel-dm:theme")||"dark";document.documentElement.dataset.theme=t}()</script>
  <script src="/painel/js/include.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
    <script>!function(){var t=localStorage.getItem("painel-dm:theme")||"dark";document.documentElement.dataset.theme=t}()</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,200..900,0..100,0..1;1,9..144,200..900,0..100,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/painel/css/tokens.css">
  <link rel="stylesheet" href="/painel/css/motion.css">
  <link rel="stylesheet" href="/painel/css/painel.css">
  <link rel="stylesheet" href="/painel/css/forms.css">
  <link rel="stylesheet" href="/painel/css/dark-mode.css">
  <link rel="stylesheet" href="/painel/css/tabela.css">
  <style>
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="painel">
    <div data-include="partials/shell.html"></div>
    <div class="main">
      <header class="topbar">
        <button class="topbar__btn" data-sidebar-toggle>Menu</button>
        <nav class="topbar__crumbs">
          <a href="/index.html">Painel</a><span class="sep">/</span><span>Acessos</span>
        </nav>
              <div class="topbar__actions">
          <button class="topbar__btn" id="theme-toggle" title="Alternar tema">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

      <main class="content">
        <header class="page-title">
          
          <div class="page-title__main">
            <p class="page-title__sub">Audiência · números</p>
            <h1>Quem <em style="font-style:italic;color:var(--brand)">leu</em>.</h1>
          </div>
                <div class="topbar__actions">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

        <!-- PAGE TOOLBAR (período) -->
        <div class="page-toolbar">
          <div style="display:flex;align-items:center;gap:var(--s-2);font-family:var(--font-mono);font-size:0.8rem;color:var(--ink-mute);text-transform:uppercase;letter-spacing:0.08em">Período:</div>
          <div class="page-toolbar__tabs" id="period-tabs">
            <button class="tab-btn is-active" data-days="7">7 dias</button>
            <button class="tab-btn" data-days="30">30 dias</button>
            <button class="tab-btn" data-days="90">90 dias</button>
          </div>
          <div class="page-toolbar__spacer"></div>
          <div class="page-toolbar__actions">
            <button class="btn btn--ghost">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              CSV
            </button>
          </div>
        </div>

        <section class="bento stagger" id="bento">
          <article class="card card--narrow card--dark">
            <p class="card__eyebrow">— Total views</p>
            <h2 class="card__metric" id="m-views">—</h2>
            <p class="card__label">acumulado</p>
          </article>
          <article class="card card--narrow">
            <p class="card__eyebrow">— Notícias</p>
            <h2 class="card__metric" id="m-noticias">—</h2>
            <p class="card__label">publicadas</p>
          </article>
          <article class="card card--narrow">
            <p class="card__eyebrow">— Slots ativos</p>
            <h2 class="card__metric" id="m-slots">—</h2>
            <p class="card__label" id="m-slots-sub">— de —</p>
          </article>
          <article class="card card--narrow">
            <p class="card__eyebrow">— CTR publicidade</p>
            <h2 class="card__metric" id="m-ctr">—<small>%</small></h2>
            <p class="card__label" id="m-ctr-sub">— impressões</p>
          </article>

          <article class="card card--wide chart-card">
            <p class="card__eyebrow">— Views por dia</p>
            <h3 class="chart-card__title">Últimos 30 dias</h3>
            <div class="chart-host chart-host--lg"><canvas id="chart-dias"></canvas></div>
          </article>

          <article class="card chart-card">
            <p class="card__eyebrow">— Editorias</p>
            <h3 class="chart-card__title">Views por editoria</h3>
            <div class="chart-host"><canvas id="chart-editorias"></canvas></div>
          </article>

          <article class="card card--full chart-card">
            <p class="card__eyebrow">— Top 10</p>
            <h3 class="chart-card__title">Notícias mais lidas</h3>
            <table class="table">
              <thead><tr><th style="width:50px">#</th><th>Manchete</th><th>Editoria</th><th style="text-align:right">Views</th></tr></thead>
              <tbody id="top-noticias"></tbody>
            </table>
          </article>
        </section>
      </main>
    </div>
  </div>

  <script type="module">
    import { mountShell } from '/painel/js/shell.js';
    import { apiGet } from '/painel/js/api.js';
    import { staggerChildren } from '/painel/js/ui.js';
    await mountShell({ route: 'acessos' });
    staggerChildren(document.getElementById('bento'));

    function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

    let currentData = null;
    let chartDias = null;
    let currentPeriod = 30;

    async function loadData(period = 30) {
      const data = await apiGet(`/acessos?period=${period}`).catch(() => null);
      if (!data) { console.error('Falha ao carregar /acessos'); return null; }
      currentData = data;
      currentPeriod = period;
      return data;
    }

    const data = await loadData();
    if (!data) { console.error('Falha ao carregar dados iniciais'); }

    // Métricas top — protegidas individualmente para não cascatear erros
    function setText(id, val) { const el = document.getElementById(id); if (el) el.textContent = val; }
    function setFirstText(id, val) { const el = document.getElementById(id); if (el?.firstChild) el.firstChild.textContent = val; else if (el) el.textContent = val; }

    function updateMetrics(data) {
      if (data) {
        setFirstText('m-views', data.totalViews.toLocaleString('pt-BR'));
        setText('m-noticias', data.totalNoticias);
        setText('m-slots', data.publicidade.slotsAtivos);
        setText('m-slots-sub', `de ${data.publicidade.totalSlots}`);
        setFirstText('m-ctr', String(data.publicidade.ctr).replace('.', ','));
        setText('m-ctr-sub', `${data.publicidade.impressoes.toLocaleString('pt-BR')} impressões`);
      }
    }

    updateMetrics(data);

    // Render dos charts — falhas isoladas
    if (typeof Chart === 'undefined' || !data) {
      console.warn('Chart.js não carregou ou sem dados — pulando gráficos');
    } else try {
      const css = getComputedStyle(document.documentElement);
      const brand = css.getPropertyValue('--brand').trim() || '#c9551d';
      const muted = css.getPropertyValue('--ink-mute').trim() || '#6e6760';
      const paper = css.getPropertyValue('--paper').trim() || '#fafaf7';

      Chart.defaults.font.family = 'IBM Plex Sans, system-ui, sans-serif';
      Chart.defaults.font.size = 11;
      Chart.defaults.color = muted;

      function renderChartDias(chartData) {
        if (chartDias) chartDias.destroy();
        chartDias = new Chart(document.getElementById('chart-dias'), {
          type: 'line',
          data: {
            labels: chartData.dias.map(d => d.data.slice(5)),
            datasets: [{
              label: 'Views',
              data: chartData.dias.map(d => d.views),
              borderColor: brand,
              backgroundColor: brand + '20',
              fill: true,
              tension: 0.35,
              pointRadius: 0,
              pointHoverRadius: 5,
              borderWidth: 2,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } },
              y: { grid: { color: '#0001' }, beginAtZero: true },
            },
          },
        });
      }

      renderChartDias(data);

    const palette = ['#c9551d','#2c6e9b','#3e7b3a','#a8881d','#7a2e2e','#5b3a8a','#1d6f7d','#999'];
    new Chart(document.getElementById('chart-editorias'), {
      type: 'doughnut',
      data: {
        labels: data.editorias.map(e => e.categoria),
        datasets: [{
          data: data.editorias.map(e => e.views),
          backgroundColor: data.editorias.map((_, i) => palette[i % palette.length]),
          borderWidth: 2,
          borderColor: paper,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '62%',
        plugins: {
          legend: {
            position: 'right',
            labels: { boxWidth: 10, padding: 8 },
          },
        },
      },
    });

    } catch (err) {
      console.error('Erro ao renderizar gráficos:', err);
    }

    // Period selection handlers
    const periodTabs = document.getElementById('period-tabs');
    if (periodTabs) {
      const buttons = periodTabs.querySelectorAll('.tab-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', async () => {
          const period = parseInt(btn.getAttribute('data-days'));

          // Update active button
          buttons.forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');

          // Load new data
          const newData = await loadData(period);
          if (!newData) return;

          // Update metrics
          updateMetrics(newData);

          // Update chart title
          const title = document.querySelector('.card--wide.chart-card .chart-card__title');
          if (title) title.textContent = `Últimos ${period} dias`;

          // Redraw chart
          if (chartDias) renderChartDias(newData);
        });
      });
    }

    // Top 10 — sempre renderiza, independente do Chart.js
    if (data) {
      document.getElementById('top-noticias').innerHTML = data.topNoticias.map((n, i) => `
        <tr>
          <td class="num"><strong style="font-family:var(--font-display);font-size:1.2rem;color:${i < 3 ? 'var(--brand)' : 'var(--ink-faint)'}">${String(i+1).padStart(2,'0')}</strong></td>
          <td><strong style="font-family:var(--font-display);font-weight:500;font-size:1rem">${esc(n.titulo)}</strong></td>
          <td><span class="tag tag--brand">${n.categoria}</span></td>
          <td class="num" style="text-align:right">${n.views.toLocaleString('pt-BR')}</td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
