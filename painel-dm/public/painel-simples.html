<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <script>document.documentElement.dataset.theme = 'light';</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel DM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
      color: white;
      padding: 20px;
      overflow-y: auto;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 30px;
      text-align: center;
    }

    .user-info {
      background: rgba(0,0,0,0.2);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 30px;
      text-align: center;
    }

    .user-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .user-role {
      font-size: 12px;
      opacity: 0.8;
    }

    .menu a {
      display: block;
      padding: 12px;
      color: white;
      text-decoration: none;
      margin: 8px 0;
      border-radius: 5px;
      transition: background 0.2s;
    }

    .menu a:hover {
      background: rgba(255,255,255,0.1);
    }

    .logout-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 30px;
      background: #d32f2f;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .logout-btn:hover {
      background: #b71c1c;
    }

    .content {
      flex: 1;
      padding: 40px;
      background: white;
      overflow-y: auto;
    }

    .header {
      margin-bottom: 30px;
      border-bottom: 2px solid #1b5e20;
      padding-bottom: 20px;
    }

    .header h1 {
      color: #1b5e20;
      margin-bottom: 5px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid #1b5e20;
    }

    .card-value {
      font-size: 32px;
      font-weight: bold;
      color: #1b5e20;
    }

    .card-label {
      font-size: 14px;
      color: #666;
      margin-top: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #f5f5f5;
      font-weight: bold;
      color: #1b5e20;
    }

    tr:hover {
      background: #f9f9f9;
    }
  </style>
</head>
<body>
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">🐊 JT</div>

    <div class="user-info">
      <div class="user-name" id="user-name">Nildo</div>
      <div class="user-role">Administrador</div>
    </div>

    <div class="menu">
      <a href="/painel/">📊 Dashboard</a>
      <a href="/painel/noticias/">📰 Notícias</a>
      <a href="/painel/acessos/">📊 Acessos</a>
      <a href="/painel/usuarios/">👥 Usuários</a>
      <a href="/painel/configuracoes/">⚙️ Configurações</a>
    </div>

    <button class="logout-btn" onclick="logout()">🚪 Sair</button>
  </div>

  <!-- CONTENT -->
  <div class="content">
    <div class="header">
      <h1>📊 Dashboard</h1>
      <p>Bem-vindo ao Painel Administrativo</p>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-label">Notícias</div>
        <div class="card-value" id="total-news">34</div>
      </div>
      <div class="card">
        <div class="card-label">Usuários</div>
        <div class="card-value" id="total-users">3</div>
      </div>
      <div class="card">
        <div class="card-label">Categorias</div>
        <div class="card-value" id="total-cats">6</div>
      </div>
      <div class="card">
        <div class="card-label">Visualizações</div>
        <div class="card-value" id="total-views">0</div>
      </div>
    </div>

    <h2 style="color: #1b5e20; margin-top: 40px;">📰 Últimas Notícias</h2>
    <table>
      <thead>
        <tr>
          <th>Título</th>
          <th>Categoria</th>
          <th>Data</th>
          <th>Views</th>
        </tr>
      </thead>
      <tbody id="news-table">
        <tr><td colspan="4" style="text-align:center; color: #999;">Carregando...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // Verificar autenticação
    const token = localStorage.getItem('painel-dm:token');
    const user = JSON.parse(localStorage.getItem('painel-dm:user') || '{}');

    if (!token || !user.nome) {
      // Redirecionar para login
      window.location.href = '/painel/login/';
    } else {
      // Mostrar nome do usuário
      document.getElementById('user-name').textContent = user.nome;

      // Carregar dados
      loadData();
    }

    async function loadData() {
      try {
        const token = localStorage.getItem('painel-dm:token');

        // Carregar notícias
        const res = await fetch('/api/noticias', {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (!res.ok) {
          throw new Error(`Erro ${res.status}`);
        }

        const data = await res.json();
        const noticias = data.items || [];

        // Atualizar cards
        document.getElementById('total-news').textContent = noticias.length;

        const totalViews = noticias.reduce((s, n) => s + (n.views || 0), 0);
        document.getElementById('total-views').textContent = totalViews;

        // Atualizar tabela
        const tbody = document.getElementById('news-table');
        if (noticias.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: #999;">Nenhuma notícia</td></tr>';
        } else {
          tbody.innerHTML = noticias.slice(0, 10).map(n => `
            <tr>
              <td>${n.titulo}</td>
              <td>${n.categoria || '-'}</td>
              <td>${new Date(n.data).toLocaleDateString('pt-BR')}</td>
              <td>${n.views || 0}</td>
            </tr>
          `).join('');
        }
      } catch (err) {
        console.error('Erro ao carregar:', err);
        document.getElementById('news-table').innerHTML = `
          <tr><td colspan="4" style="color: red; text-align: center;">Erro: ${err.message}</td></tr>
        `;
      }
    }

    function logout() {
      localStorage.removeItem('painel-dm:token');
      localStorage.removeItem('painel-dm:user');
      window.location.href = '/painel/login/';
    }
  </script>
</body>
</html>
