<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classificados · Painel DM</title>
  <meta name="robots" content="noindex, nofollow">
    <script>!function(){var t=localStorage.getItem("painel-dm:theme")||"dark";document.documentElement.dataset.theme=t}()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
    <script>!function(){var t=localStorage.getItem("painel-dm:theme")||"dark";document.documentElement.dataset.theme=t}()</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,200..900,0..100,0..1;1,9..144,200..900,0..100,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/motion.css">
  <link rel="stylesheet" href="css/painel.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/tabela.css">
  <style>
    .clas-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--s-4); }
    .clas-card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-3); overflow: hidden; transition: border-color var(--d-2), transform var(--d-2); }
    .clas-card:hover { border-color: var(--rule-strong); transform: translateY(-2px); }
    .clas-card__img { aspect-ratio: 4/3; background: var(--surface-3); }
    .clas-card__img img { width:100%; height:100%; object-fit:cover; display:block; }
    .clas-card__body { padding: var(--s-3) var(--s-4); }
    .clas-card__price { font-family: var(--font-display); font-variation-settings: 'opsz' 60; font-weight: 600; font-size: 1.1rem; color: var(--brand-deep); }
    .clas-card__title { font-size: 0.86rem; font-weight: 500; line-height: 1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-top: 2px; }
    .clas-card__meta { display:flex; justify-content:space-between; margin-top: var(--s-2); font-family: var(--font-mono); font-size: 0.66rem; letter-spacing:0.12em; text-transform:uppercase; color: var(--ink-mute); }
    .clas-card__actions { padding: 0 var(--s-4) var(--s-3); display:flex; justify-content:flex-end; }
  </style>
</head>
<body>
  <div class="painel">
    <div data-include="partials/shell.html"></div>
    <div class="main">
      <header class="topbar">
        <button class="topbar__btn" data-sidebar-toggle>Menu</button>
        <nav class="topbar__crumbs">
          <a href="/index.html">Painel</a>
          <span class="sep">/</span>
          <span>Classificados</span>
        </nav>
        <div class="topbar__actions">
          <a class="topbar__btn" href="/classificados-categorias.html">Categorias</a>
        </div>
      </header>

      <main class="content">
        <header class="page-title">
          <div class="page-title__index">08</div>
          <div class="page-title__main">
            <p class="page-title__sub">Comércio do leitor</p>
            <h1>Os <em style="font-style:italic;color:var(--brand)">classificados</em>.</h1>
          </div>
        </header>

        <section class="section">
          <div class="section__num">01</div>
          <div class="section__head">
            <h2>Novo anúncio</h2>
            <div class="section__body">
              <form id="form-clas">
                <div class="field"><label class="field__label req">Título</label><input class="input" name="titulo" required></div>
                <div class="form-grid">
                  <div class="field"><label class="field__label req">Preço (R$)</label><input class="input input--mono" name="preco" type="number" min="0" step="100" required></div>
                  <div class="field"><label class="field__label">Telefone</label><input class="input input--mono" name="telefone" placeholder="96 99999-0000"></div>
                </div>
                <div class="form-grid">
                  <div class="field"><label class="field__label">Categoria</label><select class="select" name="categoria" id="cat-sel"></select></div>
                  <div class="field"><label class="field__label">Cidade</label><select class="select" name="cidade" id="cid-sel"><option value="">—</option></select></div>
                </div>
                <div class="field"><label class="field__label">URL imagem</label><input class="input input--mono" name="imagem" placeholder="https://…"></div>
                <div class="form-actions" style="border:none;padding-top:var(--s-3);margin-top:var(--s-3)">
                  <button class="btn btn--ghost" type="reset">Limpar</button>
                  <button class="btn btn--primary" type="submit">Cadastrar anúncio</button>
                </div>
              </form>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="section__num">02</div>
          <div class="section__head">
            <h2>Anúncios publicados</h2>
            <div class="section__body">
              <div class="clas-grid stagger" id="lista-clas"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script type="module">
    import { mountShell } from './js/shell.js';
    import { apiGet, apiPost, apiDelete } from './js/api.js';
    import { toast, confirmar, staggerChildren } from './js/ui.js';
    await mountShell({ route: 'classificados' });

    function esc(s) { return String(s||'').replace(/[&<>"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
    function brl(v) { return Number(v||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL', minimumFractionDigits:0 }); }

    const cats = await apiGet('/classificados-categorias').catch(() => []);
    document.getElementById('cat-sel').innerHTML =
      '<option value="">—</option>' + cats.map(c => `<option value="${esc(c.label)}">${esc(c.label)}</option>`).join('');

    const muns = await apiGet('/municipios').catch(() => []);
    document.getElementById('cid-sel').innerHTML +=
      muns.map(m => `<option value="${esc(m.label)}">${esc(m.label)}</option>`).join('');

    async function carregar() {
      const r = await apiGet('/classificados?perPage=100').catch(() => ({ items: [] }));
      const grid = document.getElementById('lista-clas');
      if (!r.items.length) { grid.innerHTML = `<div style="grid-column:1/-1;color:var(--ink-mute);text-align:center;padding:var(--s-6)">Nenhum anúncio cadastrado.</div>`; return; }
      grid.innerHTML = r.items.map(c => `
        <article class="clas-card" data-id="${c.id}">
          <div class="clas-card__img">${c.imagem ? `<img src="${esc(c.imagem)}" alt="">` : ''}</div>
          <div class="clas-card__body">
            <div class="clas-card__price">${brl(c.preco)}</div>
            <p class="clas-card__title">${esc(c.titulo)}</p>
            <div class="clas-card__meta"><span>${esc(c.categoria||'—')}</span><span>${esc(c.cidade||'—')}</span></div>
          </div>
          <div class="clas-card__actions">
            <div class="row-actions">
              <button data-action="remover" class="danger" title="Remover">×</button>
            </div>
          </div>
        </article>
      `).join('');
      staggerChildren(grid);
    }

    document.getElementById('form-clas').addEventListener('submit', async e => {
      e.preventDefault();
      try { await apiPost('/classificados', Object.fromEntries(new FormData(e.target))); toast('Anúncio cadastrado', 'success'); e.target.reset(); carregar(); }
      catch (err) { toast(err.message, 'error'); }
    });

    document.getElementById('lista-clas').addEventListener('click', async e => {
      const btn = e.target.closest('button[data-action="remover"]'); if (!btn) return;
      const id = btn.closest('.clas-card').dataset.id;
      const ok = await confirmar({ titulo: 'Remover anúncio?', mensagem: 'Esta ação é definitiva.', okText: 'Remover' });
      if (!ok) return;
      try { await apiDelete(`/classificados/${id}`); toast('Anúncio removido', 'success'); carregar(); }
      catch (err) { toast(err.message, 'error'); }
    });

    carregar();
  </script>
</body>
</html>
