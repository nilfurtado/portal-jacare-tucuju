<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notícias Importadas · Painel DM</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Theme Detector -->
  <script>!function(){var t=localStorage.getItem("painel-dm:theme")||"dark";document.documentElement.dataset.theme=t}()</script>

  <!-- Include System -->
  <script src="/painel/js/include.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,200..900,0..100,0..1;1,9..144,200..900,0..100,0..1&display=swap" rel="stylesheet">

  <!-- CSS Padrão DM -->
  <link rel="stylesheet" href="/painel/css/tokens.css">
  <link rel="stylesheet" href="/painel/css/motion.css">
  <link rel="stylesheet" href="/painel/css/painel.css">
  <link rel="stylesheet" href="/painel/css/forms.css">
  <link rel="stylesheet" href="/painel/css/dark-mode.css">
  <link rel="stylesheet" href="/painel/css/tabela.css">

  <style>
    /* Noticias List - Padrão DM */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: var(--s-4);
      margin-top: var(--s-6);
    }

    .news-card {
      padding: var(--s-5);
      background: var(--surface);
      border: 1px solid var(--paper-line);
      border-radius: var(--r-3);
      border-left: 4px solid var(--brand);
      transition: all var(--d-1) var(--ease-out);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--s-4);
      align-items: start;
    }

    .news-card:hover {
      border-color: var(--brand);
      box-shadow: var(--sh-2);
      transform: translateY(-1px);
    }

    .news-content {
      display: flex;
      flex-direction: column;
      gap: var(--s-2);
    }

    .news-title {
      font-size: var(--t-h3);
      font-weight: 600;
      color: var(--ink);
      margin: 0;
      cursor: pointer;
      transition: color var(--d-1) var(--ease-out);
    }

    .news-title:hover {
      color: var(--brand);
    }

    .news-meta {
      display: flex;
      gap: var(--s-4);
      font-size: var(--t-small);
      color: var(--ink-mute);
      flex-wrap: wrap;
    }

    .news-meta-item {
      display: flex;
      align-items: center;
      gap: var(--s-1);
    }

    .news-excerpt {
      font-size: var(--t-small);
      color: var(--ink-mute);
      line-height: var(--lh-snug);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .news-source {
      display: inline-block;
      padding: var(--s-1) var(--s-2);
      background: var(--brand-tint);
      color: var(--brand);
      border-radius: var(--r-1);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .news-actions {
      display: flex;
      gap: var(--s-2);
    }

    .btn-importar {
      padding: var(--s-2) var(--s-4);
      background: var(--positive);
      color: white;
      border: none;
      border-radius: var(--r-2);
      cursor: pointer;
      font-weight: 600;
      font-size: var(--t-small);
      transition: all var(--d-1) var(--ease-out);
      white-space: nowrap;
    }

    .btn-importar:hover:not(:disabled) {
      opacity: 0.9;
      box-shadow: var(--sh-2);
    }

    .btn-importar:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .empty-state {
      text-align: center;
      padding: var(--s-8) var(--s-5);
      color: var(--ink-mute);
    }

    @media (max-width: 768px) {
      .news-card {
        grid-template-columns: 1fr;
      }
      .news-actions {
        flex-direction: row;
      }
      .btn-importar {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="painel">
    <!-- Shell (sidebar/menu) -->
    <div data-include="partials/shell.html"></div>

    <!-- Modal Novo Feed -->
    <div data-include="partials/modal-novo-feed.html"></div>

    <!-- Main Content -->
    <div class="main">
      <!-- TOPBAR COM BREADCRUMB -->
      <header class="topbar">
        <button class="topbar__btn" data-sidebar-toggle>Menu</button>
        <nav class="topbar__crumbs">
          <a href="/painel/">Painel</a><span class="sep">/</span><a href="/painel/noticias/">Notícias</a><span class="sep">/</span><span>Importadas</span>
        </nav>
      </header>

      <!-- CONTEÚDO PRINCIPAL -->
      <main class="content">
        <!-- PAGE TITLE -->
        <header class="page-title">
          <div class="page-title__main">
            <p class="page-title__sub">Redação · Notícias</p>
            <h1>Notícias <em style="font-style:italic;color:var(--brand)">importadas</em>.</h1>
          </div>
        </header>

        <!-- KPI CARDS (BENTO LAYOUT) -->
        <section class="bento stagger">
          <article class="card card--narrow card--dark">
            <p class="card__eyebrow">— Total carregado</p>
            <h2 class="card__metric" id="totalMetric">0</h2>
            <p class="card__label">notícias</p>
          </article>
          <article class="card card--narrow">
            <p class="card__eyebrow">— Já importadas</p>
            <h2 class="card__metric" id="importadasMetric">0</h2>
            <p class="card__label">para o portal</p>
          </article>
          <article class="card card--narrow">
            <p class="card__eyebrow">— Pendentes</p>
            <h2 class="card__metric" id="pendentesMetric">0</h2>
            <p class="card__label">a importar</p>
          </article>
          <article class="card card--narrow">
            <p class="card__eyebrow">— Feeds ativos</p>
            <h2 class="card__metric" id="feedsMetric">0</h2>
            <p class="card__label">sincronizando</p>
          </article>
        </section>

        <!-- PAGE TOOLBAR -->
        <div class="page-toolbar">
          <div class="page-toolbar__tabs">
            <input type="text" id="searchInput" class="tab-btn" placeholder="Buscar por título, autor ou palavra-chave..." style="flex: 1; min-width: 300px;">
            <select id="filterSource" class="tab-btn">
              <option value="">Todas as fontes</option>
            </select>
            <select id="sortBy" class="tab-btn">
              <option value="recente">Mais recentes</option>
              <option value="antigo">Mais antigos</option>
              <option value="titulo">Título A-Z</option>
            </select>
          </div>
          <div class="page-toolbar__spacer"></div>
          <div class="page-toolbar__actions">
            <button class="btn btn--ghost" id="btnRefresh">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2-8.83"/></svg>
              Sincronizar Feeds
            </button>
            <button class="btn btn--ghost" id="btnNovoFeed">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Novo Feed
            </button>
          </div>
        </div>

        <!-- NEWS LIST -->
        <div class="news-list" id="newsList">
          <div class="empty-state">Carregando notícias...</div>
        </div>
      </main>
    </div>
  </div>

  <!-- SCRIPT MODULE -->
  <script type="module">
    import { mountShell } from '/painel/js/shell.js';
    import { apiGet, apiPost } from '/painel/js/api.js';

    let noticias = [];
    let feeds = [];

    async function carregar() {
      try {
        const noticiasData = await apiGet('/noticias');
        const feedsData = await apiGet('/rss-feeds');

        // Parse notícias
        if (noticiasData?.items) {
          noticias = noticiasData.items;
        } else if (Array.isArray(noticiasData)) {
          noticias = noticiasData;
        } else {
          noticias = [];
        }

        // Parse feeds
        if (Array.isArray(feedsData)) {
          feeds = feedsData;
        } else if (feedsData?.items) {
          feeds = feedsData.items;
        } else if (feedsData?.data) {
          feeds = feedsData.data;
        } else {
          feeds = [];
        }

        atualizarMetricas();
        renderizar();
      } catch (err) {
        console.error('Erro ao carregar:', err);
      }
    }

    function atualizarMetricas() {
      const todasNoticias = noticias.length;
      const publicadas = noticias.filter(n => n.publicada || n.status === 'publicado' || n.importada).length;
      const pendentes = todasNoticias - publicadas;

      document.getElementById('totalMetric').textContent = todasNoticias;
      document.getElementById('importadasMetric').textContent = publicadas;
      document.getElementById('pendentesMetric').textContent = pendentes;
      document.getElementById('feedsMetric').textContent = feeds.filter(f => f.ativo).length;

      // Atualizar fontes no dropdown
      const fontes = [...new Set(noticias.map(n => n.fonte).filter(Boolean))].sort();
      const selectFonte = document.getElementById('filterSource');
      const currentValue = selectFonte.value;
      selectFonte.innerHTML = '<option value="">Todas as fontes</option>' +
        fontes.map(f => `<option value="${f}">${f}</option>`).join('');
      selectFonte.value = currentValue;
    }

    function renderizar() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const source = document.getElementById('filterSource').value;
      const sort = document.getElementById('sortBy').value;

      let filtradas = noticias.filter(n => {
        const matchSearch = !search || n.titulo?.toLowerCase().includes(search) || n.descricao?.toLowerCase().includes(search) || n.autor?.toLowerCase().includes(search);
        const matchSource = !source || n.fonte === source;
        return matchSearch && matchSource;
      });

      if (sort === 'titulo') filtradas.sort((a, b) => (a.titulo || '').localeCompare(b.titulo || ''));
      else if (sort === 'antigo') filtradas.sort((a, b) => new Date(a.data) - new Date(b.data));
      else filtradas.sort((a, b) => new Date(b.data) - new Date(a.data));

      const lista = document.getElementById('newsList');
      if (filtradas.length === 0) {
        lista.innerHTML = '<div class="empty-state">Nenhuma notícia encontrada</div>';
        return;
      }

      lista.innerHTML = filtradas.map(n => {
        const isImportada = n.publicada || n.status === 'publicado' || n.importada;
        const dataStr = new Date(n.data || n.createdAt).toLocaleDateString('pt-BR');
        return `
          <div class="news-card">
            <div class="news-content">
              <h3 class="news-title">${n.titulo}</h3>
              <div class="news-meta">
                <span class="news-source">${n.fonte || 'Desconhecida'}</span>
                ${isImportada ? '<span class="news-source" style="background: rgba(76,175,80,0.15); color: #4caf50;">✓ Importada</span>' : ''}
                <span class="news-meta-item">📅 ${dataStr}</span>
                <span class="news-meta-item">✍️ ${n.autor || 'Anônimo'}</span>
              </div>
              <p class="news-excerpt">${n.descricao || n.content || 'Sem descrição'}</p>
            </div>
            <div class="news-actions">
              ${isImportada ?
                '<button class="btn-importar" disabled>✓ Importada</button>' :
                `<button class="btn-importar" onclick="importarNoticia('${n.id}')">Importar</button>`
              }
            </div>
          </div>
        `;
      }).join('');
    }

    window.importarNoticia = async (id) => {
      try {
        await apiPost('/noticias', { id });
        carregar();
      } catch (err) {
        console.error(err);
      }
    };

    document.getElementById('searchInput').addEventListener('input', renderizar);
    document.getElementById('filterSource').addEventListener('change', renderizar);
    document.getElementById('sortBy').addEventListener('change', renderizar);

    document.getElementById('btnRefresh').addEventListener('click', async () => {
      const btn = document.getElementById('btnRefresh');
      btn.disabled = true;
      try {
        await apiPost('/painel/api/rss-feeds/sincronizar', {});
        setTimeout(() => carregar(), 1000);
      } catch (err) {
        console.error(err);
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('btnNovoFeed').addEventListener('click', () => {
      window.abrirModalNovoFeed?.();
    });

    (async () => {
      try {
        await mountShell({ route: 'noticias-importadas' });
        carregar();
      } catch (err) {
        console.error('Erro ao inicializar:', err);
      }
    })();
  </script>
</body>
</html>
