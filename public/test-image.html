<!DOCTYPE html>
<html>
<head>
  <title>Teste Imagem Anúncio</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    img { border: 2px solid red; margin: 20px 0; }
    .status { padding: 10px; background: #f0f0f0; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>🧪 Teste de Imagem do Anúncio</h1>

  <div class="status">
    <strong>Tentando carregar imagem...</strong>
  </div>

  <h2>1️⃣ Caminho relativo:</h2>
  <img src="/img/uploads/2026/06/anuncio-1780984047750-principal.jpg" alt="Teste 1" onerror="this.style.border='2px solid red'; console.log('❌ Falha 1');" onload="console.log('✅ OK 1');">

  <h2>2️⃣ WebP relativo:</h2>
  <img src="/img/uploads/2026/06/anuncio-1780984047750-principal.webp" alt="Teste 2" onerror="this.style.border='2px solid red'; console.log('❌ Falha 2');" onload="console.log('✅ OK 2');">

  <h2>3️⃣ Localhost 3000:</h2>
  <img src="http://localhost:3000/img/uploads/2026/06/anuncio-1780984047750-principal.jpg" alt="Teste 3" onerror="this.style.border='2px solid red'; console.log('❌ Falha 3');" onload="console.log('✅ OK 3');">

  <h2>4️⃣ Localhost 8000:</h2>
  <img src="http://localhost:8000/img/uploads/2026/06/anuncio-1780984047750-principal.jpg" alt="Teste 4" onerror="this.style.border='2px solid red'; console.log('❌ Falha 4');" onload="console.log('✅ OK 4');">

  <h2>5️⃣ picture + WebP:</h2>
  <picture>
    <source srcset="/img/uploads/2026/06/anuncio-1780984047750-principal.webp" type="image/webp">
    <img src="/img/uploads/2026/06/anuncio-1780984047750-principal.jpg" alt="Teste 5" style="border: 2px solid blue;" onerror="console.log('❌ Falha 5');" onload="console.log('✅ OK 5');">
  </picture>

  <hr>
  <p><strong>Abra F12 (Console) e veja qual teste passou (✅) e qual falhou (❌)</strong></p>
</body>
</html>
