  <script>
    // Aplicar tema antes do render para evitar flash
    (function(){var t=localStorage.getItem('portal-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();

    // 🔴 INJETAR CORES + CRIAR ESTILO INLINE (força funcionar)
    (function() {
      const colors = {
        '--cat-politica': '#1A237E',
        '--cat-policia': '#B71C1C',
        '--cat-economia': '#2E7D32',
        '--cat-educacao': '#1565C0',
        '--cat-esportes': '#00875A',
        '--cat-cultura': '#7B1FA2',
        '--cat-seguranca': '#EF6C00',
        '--cat-saude': '#00897B',
        '--cat-tecnologia': '#0277BD',
        '--cat-meio-ambiente': '#388E3C',
        '--cat-opiniao': '#455A64',
        '--cat-geral': '#607D8B'
      };

      // 1. Injetar como variáveis CSS
      const root = document.documentElement;
      Object.entries(colors).forEach(([key, value]) => {
        root.style.setProperty(key, value, 'important');
      });

      // 2. Criar estilos inline para forçar cores
      const style = document.createElement('style');
      style.innerHTML = `
        :root {
          --cat-politica: #1A237E !important;
          --cat-policia: #B71C1C !important;
          --cat-economia: #2E7D32 !important;
          --cat-educacao: #1565C0 !important;
          --cat-esportes: #00875A !important;
          --cat-cultura: #7B1FA2 !important;
          --cat-seguranca: #EF6C00 !important;
          --cat-saude: #00897B !important;
          --cat-tecnologia: #0277BD !important;
          --cat-meio-ambiente: #388E3C !important;
          --cat-opiniao: #455A64 !important;
          --cat-geral: #607D8B !important;
        }
      `;
      document.head.appendChild(style);
      console.log('[colors-injector] ✅ Cores injetadas 2x (variáveis + estilos)');
    })();
  </script>

  <script>
    (function () {
      const popup   = document.getElementById('ad-popup');
      const close   = document.getElementById('ad-popup-close');
      const backdrop= document.getElementById('ad-popup-backdrop');
      if (!popup) return;
      const hide = () => { popup.hidden = true; document.body.style.overflow = ''; };
      // Só exibe se ativado pelo painel admin (data-ad-active="true")
      if (popup.dataset.adActive === 'true') {
        setTimeout(() => {
          popup.hidden = false;
          document.body.style.overflow = 'hidden';
        }, 3000);
      }
      close.addEventListener('click', hide);
      backdrop.addEventListener('click', hide);
      document.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
    })();
  </script>

  <!-- 🔴 MOBILE RESPONSIVE FIX - INLINE STYLES + JS - VINDO ÚLTIMO -->
  <style>
    @media (max-width: 768px) {
      .container {
        padding-left: 8px !important;
        padding-right: 8px !important;
      }

      .main-grid {
        padding: 16px 8px !important;
        width: 100% !important;
        max-width: 100% !important;
      }

      .main-grid__primary {
        display: block !important;
      }

      .cat-section {
        width: 100% !important;
        max-width: 100% !important;
        overflow: hidden !important;
      }

      .cards-grid {
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
      }

      .card {
        width: 100% !important;
        margin-bottom: 20px !important;
        display: block !important;
      }

      .card__image {
        width: 100% !important;
      }
    }
  </style>

  <script>
    // Forçar layout responsivo em mobile via JavaScript
    function fixMobileLayout() {
      if (window.innerWidth <= 768) {
        document.querySelectorAll('.cat-section').forEach(el => {
          el.style.width = '100%';
          el.style.maxWidth = '100%';
          el.style.overflow = 'hidden';
        });

        document.querySelectorAll('.cards-grid').forEach(el => {
          el.style.width = '100%';
          el.style.maxWidth = '100%';
          el.style.display = 'block';
        });

        document.querySelectorAll('.card').forEach(el => {
          el.style.width = '100%';
          el.style.display = 'block';
          el.style.marginBottom = '20px';
        });
      }
    }

    // Rodar ao carregar
    document.addEventListener('DOMContentLoaded', fixMobileLayout);
    window.addEventListener('resize', fixMobileLayout);
    fixMobileLayout();
  </script>
